name: Record demo
on:
  push:
    branches: [feat/local-playground]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest -v
      - run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Record walkthrough
        run: |
          python lab.py > /tmp/webhook-lab.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          node scripts/record-demo.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: webhook-lab-demo
          path: |
            docs/demo.webm
            docs/screenshot.png
            docs/mobile.png
            docs/sample-report.json
          retention-days: 30
